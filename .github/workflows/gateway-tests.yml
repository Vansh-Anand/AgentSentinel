name: Gateway security tests

on:
  push:
  pull_request:

jobs:
  gateway:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install gateway test dependencies
        run: python -m pip install "cryptography>=42,<51" "pydantic>=2,<3"
      - name: Run gateway boundary tests
        run: python -m unittest discover -s tests/gateway -v
      - name: Run deterministic demo
        run: python -m agent_runtime.demo
      - name: Run full agent fixture
        run: python -m agent_runtime.runner_demo
      - name: Run policy fixture evaluation
        run: python -m benchmarks.gateway_eval
      - name: Smoke test versioned model evaluation harness without credentials
        run: python -m benchmarks.model_eval --provider fixture --per-category 2
      - name: Run held-out evaluation fixtures
        run: python -m benchmarks.model_eval --provider fixture --corpus model_cases_v2.json --per-category 2 --output .data/model-eval/heldout-fixture.json
      - name: Verify held-out signed final results
        run: python -m benchmarks.verify_model_report .data/model-eval/heldout-fixture.json --check-current-source

  runtime-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests/runtime -v
      - name: Run portable gateway, API, and backend regression tests
        run: python -m pytest tests/runtime tests/backend -q -p no:cacheprovider
      - name: Validate approved portable source baseline
        run: python -c "from agent_runtime.secure_lab import integrity_status; result=integrity_status(); print(result); assert result['valid']"
      - name: Run portable capability evaluation smoke
        run: python scripts/evaluate_portable_lab.py --limit 8 --output ci-portable-smoke.json
      - run: python -m pytest tests/dashboard_api -q --basetemp=.data/pytest-run -p no:cacheprovider
      - name: Validate native bridge and fail-closed attestation contracts
        run: python -m pytest tests/integration/test_l3_collector_bridge.py tests/integration/test_l7_trust.py -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test -- --maxWorkers=2

  windows-l3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest tests.runtime.test_windows_l3 -v

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install "cryptography>=42,<51"
      - name: Build credential-free API
        run: docker compose build api
      - name: Build credential-free UI
        run: docker compose build ui
      - name: Start credential-free API and UI
        run: docker compose up --no-build -d
      - name: Verify gateway, UI, and portable signed evidence
        run: python -m scripts.compose_smoke
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop disposable services
        if: always()
        run: docker compose down -v
